[package]
name = "dolphi"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Private agent memory and owner-controlled shared workspaces"
publish = false

[features]
default = ["turso-backend"]
turso-backend = ["dep:turso"]
sqlcipher-backend = ["dep:sqlcipher-engine"]

[patch.crates-io]
libsqlite3-sys = { path = "experiments/sqlcipher/vendor/libsqlite3-sys" }
openssl-src = { path = "experiments/sqlcipher/vendor/openssl-src" }

[dependencies]
# Milestone one does not use FTS. Keep its compression/cache dependency tree
# out of the build; requalify security before enabling optional engine features.
turso = { version = "=0.8.3", default-features = false, optional = true }
sqlcipher-engine = { package = "dolphi-encryption-evaluation", path = "experiments/sqlcipher", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "signal", "time"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
aes-gcm = "0.10"
aead = { version = "=0.5.2", features = ["stream"] }
zeroize = "1"
getrandom = "0.4"
tempfile = "3"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
tower = { version = "0.5", features = ["limit", "util"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }

[dev-dependencies]
http-body-util = "0.1"

