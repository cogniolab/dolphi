name: Feature proposal
description: Describe the problem and proposed behavior.
title: "proposal: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed behavior and alternatives
    validations:
      required: true
  - type: textarea
    id: implications
    attributes:
      label: Security, compatibility and migration implications
